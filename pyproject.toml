[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-lakehouse-quality-lab"
version = "0.1.0"
description = "A reproducible Bronze/Silver/Gold data quality lab with DuckDB and Parquet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.5,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
